<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <th:block th:insert="~{layout/layout::library}"/>
</head>
<body>
<div class="container mt-4">
    <h2>Danh sách sản phẩm</h2>
    <form th:action="@{/san-pham/search}" method="get" class="mb-3">

        <input type="text"
               name="name"
               placeholder="Nhập tên sản phẩm..."
               class="form-control w-25 d-inline">

        <button type="submit" class="btn btn-primary">
            <i class="fa fa-search"></i> Tìm
        </button>

    </form>
    <p class="text-success" th:text="${message}"></p>
    <a th:href="@{/san-pham/add}" class="btn btn-success mb-3">
        <i class="fa-regular fa-square-plus"></i> Thêm mới
    </a>
    <table class="table table-bordered table-hover">

        <thead class="table-dark">
        <tr>
            <th>STT</th>
            <th>ID</th>
            <th>Tên SP</th>
            <th>Giá</th>
            <th>Sửa</th>
            <th>Xóa</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="sp,status : ${sanPhamList}">

            <td th:text="${status.count}"></td>
            <td th:text="${sp.id}"></td>
            <td th:text="${sp.name}"></td>
            <td th:text="${sp.price}"></td>

            <td>
                <a th:href="@{/san-pham/update(id=${sp.id})}"
                   class="btn btn-primary btn-sm">
                    <i class="fa-solid fa-pen-to-square"></i> Edit
                </a>
            </td>
            <td>
                <button class="btn btn-danger btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteModal"
                        th:attr="data-id=${sp.id},data-name=${sp.name}">
                    <i class="fa-solid fa-trash-can"></i> Delete
                </button>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<div class="modal fade" id="deleteModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Xác nhận xóa
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form th:action="@{/san-pham/delete}" method="post">

                    <input type="hidden" name="id" id="deleteId">

                    Bạn có chắc muốn xóa sản phẩm
                    <strong id="deleteName" class="text-danger"></strong> ?

                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Hủy
                        </button>
                        <button type="submit"
                                class="btn btn-danger">
                            Xác nhận xóa
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>

    const deleteModal = document.getElementById('deleteModal')

    deleteModal.addEventListener('show.bs.modal', function (event) {

        const button = event.relatedTarget
        const id = button.getAttribute('data-id')
        const name = button.getAttribute('data-name')
        document.getElementById('deleteId').value = id
        document.getElementById('deleteName').innerText = name

    })
</script>
</body>
</html>
