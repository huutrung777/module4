<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cập nhật bài viết</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; display:flex; justify-content:center; align-items:center; height:100vh;}
    .box { background:white; padding:30px; width:500px; border-radius:10px; box-shadow:0 0 10px #ccc;}
    input, textarea, select { width:100%; padding:10px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px;}
    button { background:#007bff; color:white; padding:10px; border:none; border-radius:5px; width:100%;}
    a { display:block; text-align:center; margin-top:10px;}
  </style>
</head>
<body>

<div class="box">
  <h2>Cập nhật bài viết</h2>

  <form th:action="@{/blog/update}" th:object="${blog}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Tiêu đề</label>
    <input type="text" th:field="*{tieuDe}" required>

    <label>Tóm tắt</label>
    <input type="text" th:field="*{tomTat}">

    <label>Nội dung</label>
    <textarea th:field="*{noiDung}"></textarea>

    <label>Tác giả</label>
    <input type="text" th:field="*{tacGia}">

    <label>Danh mục</label>
    <select th:field="*{category.id}">
      <option th:each="c : ${categories}"
              th:value="${c.id}"
              th:text="${c.name}">
      </option>
    </select>

    <button type="submit">Cập nhật</button>
    <a th:href="@{/blog}">Quay lại</a>
  </form>
</div>

</body>
</html>
