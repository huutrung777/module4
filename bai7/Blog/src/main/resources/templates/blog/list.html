<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống Quản lý Blog</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; padding: 40px; }
    .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

    /* Header & Action Row */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    /* Search Box */
    .search-box { display: flex; gap: 8px; }
    .search-box input {
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      width: 250px;
      outline: none;
    }
    .search-box input:focus { border-color: #3498db; }

    /* Table Styling */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { background-color: #34495e; color: white; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #eee; }

    /* Buttons */
    .btn-add { background: #27ae60; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; }
    .btn-add:hover { background: #219150; }

    .btn-search { background-color: #34495e; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    .btn-search:hover { background-color: #2c3e50; }

    /* Pagination */
    .pagination-simple { margin-top: 30px; display: flex; justify-content: center; align-items: center; gap: 20px; }
    .page-info { font-size: 15px; color: #444; font-weight: 500; }
    .page-info .current { color: #3498db; font-weight: bold; }
    .btn-nav { background-color: #34495e; color: white; padding: 8px 16px; text-decoration: none; border-radius: 5px; font-size: 14px; transition: 0.3s; }
    .btn-nav:hover { background-color: #2c3e50; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<div class="container">
  <h2>Quản lý bài viết Blog</h2>

  <p style="color: green" th:text="${message}"></p>

  <div class="action-row">
    <a th:href="@{/blog/add}" class="btn-add">+ Thêm mới</a>

    <form th:action="@{/blog}" method="get" class="search-box">
      <input type="text" name="searchName" th:value="${searchName}" placeholder="Tìm theo tiêu đề...">
      <button type="submit" class="btn-search">Tìm kiếm</button>
    </form>
  </div>

  <table>
    <thead>
    <tr>
      <th style="width: 50px;">ID</th>
      <th>Tiêu đề</th>
      <th>Tóm tắt</th>
      <th>Tác giả</th>
      <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="blog : ${blogPage.content}">
      <td th:text="${blog.id}"></td>
      <td th:text="${blog.tieuDe}" style="font-weight: bold;"></td>
      <td th:text="${blog.tomTat}"></td>
      <td th:text="${blog.tacGia}"></td>
      <td>
        <a th:href="@{/blog/update(id=${blog.id})}" style="color: #3498db; text-decoration: none; margin-right: 10px;">Sửa</a>
        <form th:action="@{/blog/delete}" method="post" style="display:inline;">
          <input type="hidden" name="id" th:value="${blog.id}">
          <button type="submit" style="color: #e74c3c; border: none; background: none; cursor: pointer;"
                  onclick="return confirm('Xóa không?')">Xóa</button>
        </form>
      </td>
    </tr>
    <tr th:if="${blogPage.totalElements == 0}">
      <td colspan="5" style="text-align: center; color: #999; padding: 30px;">Không tìm thấy bài viết nào phù hợp.</td>
    </tr>
    </tbody>
  </table>

  <div class="pagination-simple" th:if="${blogPage.totalPages > 0}">
    <a th:if="${blogPage.hasPrevious()}"
       class="btn-nav"
       th:href="@{/blog(page=${blogPage.number - 1}, searchName=${searchName})}">
      &laquo; Trước
    </a>

    <div class="page-info">
      Trang <span class="current" th:text="${blogPage.number + 1}"></span>
      / <span th:text="${blogPage.totalPages}"></span>
    </div>

    <a th:if="${blogPage.hasNext()}"
       class="btn-nav"
       th:href="@{/blog(page=${blogPage.number + 1}, searchName=${searchName})}">
      Sau &raquo;
    </a>
  </div>
</div>

</body>
</html>
