<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm mới bài hát</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-message { color: red; font-size: 0.9em; margin-top: 5px; }
        .container { max-width: 600px; margin-top: 50px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4">Thêm mới bài hát</h2>

    <form th:action="@{/songs/save}" th:object="${songDto}" method="post" class="shadow p-4 rounded bg-light">

        <div class="mb-3">
            <label class="form-label">Tên bài hát:</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"/>
            <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Nghệ sĩ:</label>
            <input type="text" th:field="*{artist}" class="form-control"
                   th:classappend="${#fields.hasErrors('artist')} ? 'is-invalid' : ''"/>
            <div class="error-message" th:if="${#fields.hasErrors('artist')}" th:errors="*{artist}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Thể loại:</label>
            <input type="text" th:field="*{genre}" class="form-control"
                   th:classappend="${#fields.hasErrors('genre')} ? 'is-invalid' : ''"/>
            <div class="error-message" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></div>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/songs}" class="btn btn-secondary">Quay lại</a>
            <button type="submit" class="btn btn-primary">Lưu bài hát</button>
        </div>
    </form>
</div>
</body>
</html>
