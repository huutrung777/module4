<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Giỏ hàng của bạn</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
<h2 class="mb-4">01. GIỎ HÀNG</h2>

<div th:if="${cart.empty}" class="alert alert-info">
  Giỏ hàng đang trống. <a href="/static">Mua sắm ngay!</a>
</div>

<div th:unless="${cart.empty}">
  <table class="table align-middle">
    <thead class="table-light">
    <tr>
      <th>Xóa</th>
      <th>Hình ảnh</th>
      <th>Thông tin sản phẩm</th>
      <th>Số lượng</th>
      <th class="text-end">Thành tiền</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${cart}">
      <td>
        <a th:href="@{/cart/remove(id=${entry.key})}" class="btn btn-sm btn-outline-danger">✖</a>
      </td>
      <td>
        <img th:src="@{'/images/' + ${entry.value.image}}" width="70" class="rounded border">
      </td>
      <td>
        <div class="fw-bold" th:text="${entry.value.name}"></div>
        <small class="text-muted" th:text="${#numbers.formatDecimal(entry.value.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></small>
      </td>
      <td>
        <select class="form-select w-auto"
                th:onchange="|window.location.href='/cart/update?id=' + ${entry.key} + '&quantity=' + this.value|">
          <option th:each="i : ${#numbers.sequence(1, 10)}"
                  th:value="${i}" th:text="${i}"
                  th:selected="${i == entry.value.quantity}"></option>
        </select>
      </td>
      <td class="text-end fw-bold text-danger"
          th:text="${#numbers.formatDecimal(entry.value.price * entry.value.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
      </td>
    </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <a href="/static" class="btn btn-secondary">← Tiếp tục chọn hoa</a>
    <div class="text-end">
      <h4>Tổng cộng: <span class="text-danger" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></h4>
      <a th:href="@{/checkout}" class="btn btn-danger btn-lg px-5 mt-2">THANH TOÁN</a>
    </div>
  </div>
</div>
</body>
</html>
