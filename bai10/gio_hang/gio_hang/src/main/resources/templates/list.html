<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Danh sách hoa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .product-card { border: 1px solid #eee; transition: 0.3s; position: relative; }
    .product-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .badge-new { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 2px 8px; font-size: 12px; }
  </style>
</head>
<body class="container py-5">
<h2 class="text-center mb-4">DANH SÁCH SẢN PHẨM</h2>
<div class="row">
  <div class="col-md-3 mb-4" th:each="p : ${list}">
    <div class="card product-card p-2 text-center">
      <span class="badge-new">NEW!</span>
      <a th:href="@{'/product/' + ${p.id}}">
        <img th:src="@{'/images/' + ${p.image}}" class="card-img-top" alt="flower">
      </a>
      <div class="card-body">
        <h6 class="card-title"><a th:href="@{'/product/' + ${p.id}}" class="text-decoration-none text-dark" th:text="${p.name}"></a></h6>
        <p class="text-danger fw-bold" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
